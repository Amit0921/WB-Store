server:
  port: 8080

spring:
  application:
    name: wb-store

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/wb_store
    username: postgres
    password:

    hikari:
      pool-name: WbStoreHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

#  jackson:
#    default-property-inclusion: non_null
#    serialization:
#      WRITE_DATES_AS_TIMESTAMPS: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

  api-docs:
    path: /api-docs

  show-actuator: true

application:
  security:
    jwt:
      secret-key: ${APPLICATION_SECURITY_JWT_SECRET_KEY:ATPUGTIMA1234567890ATPUGTIMA1234567890ATPUGTIMA}
      expiration: 1800
      refresh-expiration: 604800

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

info:
  app:
    name: WB Store Application
    description: Wholesale Billing & Ledger Management System
    version: 1.0.0

logging:
  file:
    name: logs/wb-store.log

  level:
    root: INFO

    org:
      springframework:
        web: INFO

      hibernate:
        SQL: OFF

    com:
      wholesale:
        store: DEBUG